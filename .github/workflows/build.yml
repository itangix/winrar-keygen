name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run tests
        run: zig build test

  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            target: x86_64-linux-gnu
            ext: ''
          - name: linux-arm64
            target: aarch64-linux-gnu
            ext: ''
          - name: windows-x64
            target: x86_64-windows-gnu
            ext: '.exe'
          - name: windows-arm64
            target: aarch64-windows-gnu
            ext: '.exe'
          - name: macos-arm64
            target: aarch64-macos
            ext: ''
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Prepare artifact
        run: |
          cp "zig-out/bin/winrar-keygen${{ matrix.ext }}" "winrar-keygen-${{ matrix.name }}${{ matrix.ext }}"
          chmod +x "winrar-keygen-${{ matrix.name }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: winrar-keygen-${{ matrix.name }}
          path: winrar-keygen-${{ matrix.name }}${{ matrix.ext }}
